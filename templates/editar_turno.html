<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Turno</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1>Editar turno</h1>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Nombres
            </label>

            <input
                type="text"
                name="nombres"
                class="form-control"
                value="{{ turno.nombres }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Apellidos
            </label>

            <input
                type="text"
                name="apellidos"
                class="form-control"
                value="{{ turno.apellidos }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Tipo de documento
            </label>

            <select name="tipo_documento" class="form-select">

                <option value="CC"
                {% if turno.tipo_documento == 'CC' %}selected{% endif %}>
                    Cédula de ciudadanía
                </option>

                <option value="TI"
                {% if turno.tipo_documento == 'TI' %}selected{% endif %}>
                    Tarjeta de identidad
                </option>

                <option value="CE"
                {% if turno.tipo_documento == 'CE' %}selected{% endif %}>
                    Cédula de extranjería
                </option>

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Número de documento
            </label>

            <input
                type="text"
                name="numero_documento"
                class="form-control"
                value="{{ turno.numero_documento }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Fecha
            </label>

            <input
                type="date"
                name="fecha"
                class="form-control"
                value="{{ turno.fecha }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Hora
            </label>

            <input
                type="time"
                name="hora"
                class="form-control"
                value="{{ turno.hora }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Servicio
            </label>

            <input
                type="text"
                name="servicio"
                class="form-control"
                value="{{ turno.servicio }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Descripción
            </label>

            <textarea
                name="descripcion"
                class="form-control"
                rows="4">{{ turno.descripcion }}</textarea>

        </div>


        <button
            type="submit"
            class="btn btn-success">
            Guardar cambios
        </button>

        <a
            href="{{ url_for('ver_turnos') }}"
            class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>

</html>
